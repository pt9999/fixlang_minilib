[general]
name = "sandbox-ncurses"
version = "0.2.0"
fix_version = "1.6.0"
authors = ["pt9999"]
license = "MIT"

[build]
files = [
    "ncurses.fix",
]
opt_level = "basic"
objects = ["lib.o"]
preliminary_commands = [["make", "lib.o"]]
dynamic_links = ["ncursesw"]

[[dependencies]]
name = "minilib-common"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-common.git" }

[[dependencies]]
name = "minilib-io"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-io.git" }

[[dependencies]]
name = "minilib-monad"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-monad.git" }

[[dependencies]]
name = "minilib-text"
version = "*"
git = { url = "https://github.com/pt9999/fixlang-minilib-text.git" }
